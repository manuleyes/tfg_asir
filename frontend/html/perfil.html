<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Vigilancia Inteligente</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 data-i18n="panel">Panel</h2>
                <button id="toggleSidebar" class="btn-menu"></button>
            </div>

            <nav class="nav-menu">
                <a href="/dashboard" class="nav-item" data-page="dashboard">
                    <span class="text" data-i18n="dashboard">Dashboard</span>
                </a>
                <a href="/camaras" class="nav-item" data-page="camaras">
                    <span class="text" data-i18n="camaras">Cámaras</span>
                </a>
                <a href="/personas" class="nav-item" data-page="personas">
                    <span class="text" data-i18n="personas">Personas</span>
                </a>
                <a href="/vehiculos" class="nav-item" data-page="vehiculos">
                    <span class="text" data-i18n="vehiculos">Vehículos</span>
                </a>
                <a href="/alertas" class="nav-item" data-page="alertas">
                    <span class="text" data-i18n="alertas">Alertas</span>
                </a>
                <a href="/bd" class="nav-item" data-page="bd">
                    <span class="text" data-i18n="baseDatos">Base de Datos</span>
                </a>
                <a href="/reportes" class="nav-item" data-page="reportes">
                    <span class="text" data-i18n="reportes">Reportes</span>
                </a>
            </nav>

            <div class="sidebar-footer"></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="top-bar-left">
                    <h1 data-i18n="miPerfil">Mi Perfil</h1>
                </div>
                <div class="top-bar-right">
                    <!-- Language Button -->
                    <div class="menu-container">
                        <button id="languageBtn" class="icon-btn" title="Idioma">
                            <img id="langFlagDisplay" src="/static/img/flag-es.svg" alt="Idioma" class="btn-icon">
                        </button>
                        <div id="languageDropdown" class="dropdown hidden">
                            <button class="dropdown-item" data-lang="es">
                                <img src="/static/img/flag-es.svg" alt="Español" class="flag-small">
                                Español
                            </button>
                            <button class="dropdown-item" data-lang="en">
                                <img src="/static/img/flag-en.svg" alt="English" class="flag-small">
                                English
                            </button>
                            <button class="dropdown-item" data-lang="jp">
                                <img src="/static/img/flag-jp.svg" alt="日本語" class="flag-small">
                                日本語
                            </button>
                        </div>
                    </div>

                    <!-- Theme Button -->
                    <div class="menu-container">
                        <button id="darkModeToggle" class="icon-btn" title="Tema">
                            <img id="themeIcon" src="/static/img/moon.svg" alt="Tema" class="btn-icon">
                        </button>
                    </div>

                    <!-- Profile Button -->
                    <div class="menu-container">
                        <button id="profileBtn" class="icon-btn" title="Cuenta">
                            <img src="/static/img/profile.svg" alt="Perfil" class="btn-icon">
                        </button>
                        <div id="profileDropdown" class="dropdown hidden">
                            <button class="dropdown-item logout-item" id="logoutBtn" data-i18n="cerrarSesion">
                                Cerrar sesión
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content">
                <div class="profile-container">

                    <!-- Mensaje global de feedback -->
                    <div id="profileAlert" class="hidden" style="margin-bottom:16px;padding:12px 16px;border-radius:8px;font-size:14px;"></div>

                    <!-- ── TARJETA PRINCIPAL ── -->
                    <div class="card" style="margin-bottom:16px;">
                        <div style="display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;padding:8px 0;">
                            <!-- Avatar -->
                            <div style="display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;">
                                <div id="profileAvatarEl" style="width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#357abd);display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;border:3px solid var(--border);cursor:pointer;" title="Cambiar foto">
                                    <img id="avatarImg" alt="Avatar" style="display:none;width:100%;height:100%;object-fit:cover;">
                                    <svg id="avatarSvg" width="44" height="44" viewBox="0 0 100 100"><circle cx="50" cy="30" r="20" fill="currentColor"/><ellipse cx="50" cy="75" rx="30" ry="22" fill="currentColor"/></svg>
                                </div>
                                <button type="button" id="avatarChangeBtn" data-i18n="cambiarFoto" style="font-size:11px;padding:4px 12px;border:1px solid var(--primary);border-radius:6px;background:transparent;color:var(--primary);cursor:pointer;">Cambiar foto</button>
                                <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp" style="display:none;">
                            </div>

                            <!-- Tabla de datos -->
                            <div style="flex:1;min-width:260px;">
                                <table class="profile-table">
                                    <tbody>
                                        <tr>
                                            <td class="pt-label" data-i18n="labelUsuarioTable">Usuario</td>
                                            <td class="pt-value" id="infoUsername">—</td>
                                        </tr>
                                        <tr>
                                            <td class="pt-label" data-i18n="labelNombreVisible">Nombre visible</td>
                                            <td class="pt-value">
                                                <span id="infoDisplayName">—</span>
                                                <button id="editNameBtn" class="pt-edit-btn" data-i18n="editar" title="Editar">Editar</button>
                                                <div id="editNameForm" style="display:none;margin-top:6px;display:none;">
                                                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                                                        <input type="text" id="displayNameInput" maxlength="40" placeholder="Nombre para mostrar" style="flex:1;min-width:120px;padding:5px 10px;border:1px solid var(--primary);border-radius:6px;font-size:13px;background:var(--bg-secondary);color:var(--text);">
                                                        <button id="saveNameBtn" class="btn btn-primary btn-sm" data-i18n="guardar" style="padding:5px 12px;font-size:13px;">Guardar</button>
                                                        <button id="cancelNameBtn" data-i18n="cancelar" style="padding:5px 10px;font-size:13px;background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text);">Cancelar</button>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="pt-label" data-i18n="labelRolTable">Rol</td>
                                            <td class="pt-value"><span id="infoRole">—</span></td>
                                        </tr>
                                        <tr>
                                            <td class="pt-label" data-i18n="labelEmailTable">Email</td>
                                            <td class="pt-value">
                                                <span id="infoEmailDisplay">—</span>
                                                <button id="editEmailBtn" class="pt-edit-btn" data-i18n="editar">Editar</button>
                                                <div id="editEmailForm" style="display:none;margin-top:6px;">
                                                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                                                        <input type="email" id="emailInput" maxlength="100" placeholder="correo@ejemplo.com" style="flex:1;min-width:160px;padding:5px 10px;border:1px solid var(--primary);border-radius:6px;font-size:13px;background:var(--bg-secondary);color:var(--text);">
                                                        <button id="saveEmailBtn" class="btn btn-primary btn-sm" data-i18n="guardar" style="padding:5px 12px;font-size:13px;">Guardar</button>
                                                        <button id="cancelEmailBtn" data-i18n="cancelar" style="padding:5px 10px;font-size:13px;background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text);">Cancelar</button>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="pt-label" data-i18n="labelTelefonoTable">Teléfono</td>
                                            <td class="pt-value">
                                                <span id="infoPhoneDisplay">—</span>
                                                <button id="editPhoneBtn" class="pt-edit-btn" data-i18n="editar">Editar</button>
                                                <div id="editPhoneForm" style="display:none;margin-top:6px;">
                                                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                                                        <input type="tel" id="phoneInput" maxlength="30" placeholder="+34 600 000 000" style="flex:1;min-width:160px;padding:5px 10px;border:1px solid var(--primary);border-radius:6px;font-size:13px;background:var(--bg-secondary);color:var(--text);">
                                                        <button id="savePhoneBtn" class="btn btn-primary btn-sm" data-i18n="guardar" style="padding:5px 12px;font-size:13px;">Guardar</button>
                                                        <button id="cancelPhoneBtn" data-i18n="cancelar" style="padding:5px 10px;font-size:13px;background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text);">Cancelar</button>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="pt-label" data-i18n="labelMiembroDesde">Miembro desde</td>
                                            <td class="pt-value" id="infoCreated">—</td>
                                        </tr>
                                        <tr>
                                            <td class="pt-label">2FA</td>
                                            <td class="pt-value" id="info2fa">—</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- ── CAMBIAR CONTRASEÑA ── -->
                    <div class="card">
                        <div class="card-header" style="cursor:pointer;" onclick="this.nextElementSibling.classList.toggle('hidden')">
                            <h2 data-i18n="cambiarPass">Cambiar Contraseña</h2>
                            <span data-i18n="expandir" style="font-size:13px;color:var(--text-muted);">Expandir</span>
                        </div>
                        <div class="hidden" style="padding:0 0 8px;">
                            <form id="passwordForm">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label data-i18n="passActual">Contraseña actual</label>
                                        <input type="password" id="currentPassword" placeholder="••••••••" autocomplete="current-password">
                                    </div>
                                    <div class="form-group">
                                        <label data-i18n="passNueva">Nueva contraseña</label>
                                        <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
                                    </div>
                                    <div class="form-group">
                                        <label data-i18n="passConfirmar">Confirmar contraseña</label>
                                        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary" data-i18n="cambiarPassBtn">Cambiar contraseña</button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/static/js/perfil-edit.js" defer></script>
    <script src="/static/js/language.js" defer></script>
    <script src="/static/js/darkmode.js" defer></script>
    <script src="/static/js/sidebar-toggle.js" defer></script>
    <script src="/static/js/auth.js" defer></script>
    <script src="/static/js/profile-page.js" defer></script>
</body>
</html>
